name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - run: apk add --no-cache git nodejs npm
      - uses: actions/checkout@v4
      - run: npm install -g pnpm@10
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  lint:
    needs: syntax
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - run: apk add --no-cache git nodejs npm
      - uses: actions/checkout@v4
      - run: npm install -g pnpm@10
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - run: apk add --no-cache git nodejs npm
      - uses: actions/checkout@v4
      - run: npm install -g pnpm@10
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test
