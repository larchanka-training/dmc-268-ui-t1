name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# У токена прогона только чтение: CI ничего не пишет в репозиторий.
permissions:
  contents: read

# Новый пуш в ветку пул-реквеста отменяет прогон по устаревшему коммиту.
# Пуши в main и develop не отменяются: там нужен результат по каждому коммиту.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Те же проверки, что AGENTS.md требует перед коммитом: хуки можно обойти
  # (--no-verify), CI — нет. Setup общий — .github/actions/setup.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm run typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm run lint
      - run: pnpm run stylelint
      - run: pnpm run format:check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm run test

  # Сборка проходит, и в бандл не попал мок входа: он нужен только dev-серверу
  # (плагин с apply: 'serve' в vite.config.ts). Ловит импорт src/build/mockAuth.ts
  # из кода приложения — по строке фикстуры, которая переживает минификацию.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm run build
      - name: Мока входа нет в сборке
        run: |
          if grep -rl 'Локальный пользователь' dist; then
            echo 'Мок входа попал в production-сборку' >&2
            exit 1
          fi

  # Ошибка в спеке иначе всплывает только при архиве change: требование без
  # сценария, MODIFIED, теряющий сценарии. --strict ловит и стилистику —
  # слишком длинные требования. Версия openspec закреплена в package.json:
  # новые проверки приходят с обновлением зависимости, а не сами по себе.
  openspec:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm run spec:validate

  # Конфиг nginx иначе проверялся бы только деплоем: с ошибкой контейнер не
  # стартует, и стенд ложится. Проверяем собранный образ, а не файлы из
  # репозитория: важны версия nginx, подключённый модуль ACME и конфиг,
  # который скрипт выбора режима собирает из шаблона. Сертификат и адрес API
  # подставляются переменными, поэтому nginx -t не нужны ни файлы
  # сертификата, ни сеть.
  nginx:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t dmc268-ui:ci .
      - name: nginx -t в режиме HTTP
        run: >-
          docker run --rm --network none --entrypoint sh dmc268-ui:ci
          -c '/docker-entrypoint.d/40-select-site.sh && nginx -t'
      - name: nginx -t в режиме HTTPS
        run: >-
          docker run --rm --network none -e PUBLIC_HOST=ci.invalid
          --entrypoint sh dmc268-ui:ci
          -c '/docker-entrypoint.d/40-select-site.sh && nginx -t'
      # nginx -t не ловит ошибки маршрутизации: поднимаем образ в режиме HTTP
      # и проверяем лендинг, приложение под /app/, редирект и 404.
      - name: Маршруты в режиме HTTP
        run: |
          docker run -d --name ui-routes -p 8080:80 dmc268-ui:ci
          trap 'docker logs ui-routes; docker rm -f ui-routes' EXIT
          for _ in $(seq 1 20); do
            curl -fsS -o /dev/null http://localhost:8080/ && break
            sleep 1
          done
          scripts/check-routes.sh http://localhost:8080

  # Конфигурация в infra/ перестала быть тривиальной: там backend.tf,
  # registry_auth и переменные, от которых зависит деплой. Без этого job'а
  # ошибка в них обнаруживалась бы только самим деплоем.
  #
  # Версия та же, что в deploy.yml: проверять на одной, катить на другой —
  # значит проверять не то. `-backend=false` позволяет обойтись без доступа к
  # состоянию, который у CI и не должен быть при простой валидации.
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.6
      - run: tofu fmt -check -recursive infra/
      - run: cd infra && tofu init -backend=false && tofu validate
