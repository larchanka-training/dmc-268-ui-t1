# Деплой интерфейса на стенд. Катит только develop, как и бэкенд: сервер один.
#
# Стек бэкенда обязан быть применён раньше — интерфейс подключается к сети,
# которую создаёт он (требование спеки frontend-delivery). На чистом сервере
# этот деплой откажется выполняться, и это правильное поведение.
# См. openspec/changes/deploy-frontend-stack/.
name: Deploy

# Деплой ждёт CI: workflow_run срабатывает, когда CI завершился. Работает
# только из ветки по умолчанию — у нас это develop.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  STATE_PORT: '9000'

jobs:
  # Какой коммит катить. Автоматический запуск — только после зелёного CI
  # по пушу в develop: прогон CI по пул-реквесту из ветки с именем develop
  # тоже попадает под фильтр branches, поэтому событие сверяется отдельно.
  # Ручной запуск — осознанное действие, CI он не ждёт.
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - name: Выбрать коммит
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          # У workflow_run GITHUB_SHA — вершина ветки по умолчанию на момент
          # запуска, а не проверенный коммит; он лежит в head_sha.
          RUN_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          # Прогоны CI по develop не отменяют друг друга и могут закончиться
          # не по порядку: без этой сверки поздно завершившийся CI старого
          # коммита откатил бы стенд назад. Новый коммит катит свой прогон.
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            tip="$(gh api "repos/${GITHUB_REPOSITORY}/commits/develop" --jq .sha)"
            if [ "$tip" != "$RUN_SHA" ]; then
              echo "::notice::${RUN_SHA} уже не вершина develop (${tip}), деплой пропущен"
              exit 0
            fi
          fi
          echo "sha=${RUN_SHA}" >> "$GITHUB_OUTPUT"

  image:
    needs: gate
    if: needs.gate.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Посчитать имя образа
        id: meta
        env:
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          # Тег по commit sha: так видно, какой коммит сейчас на стенде.
          image="$(printf '%s' "$IMAGE_NAME" | tr 'A-Z' 'a-z'):${SHA}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "$image"

      # Без этого шага buildx работает на docker-драйвере, который не умеет
      # экспортировать кеш в gha.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Убедиться, что образ забирается обратно
        run: |
          set -euo pipefail
          docker manifest inspect "${{ steps.meta.outputs.image }}" > /dev/null
          echo "образ доступен по тегу"

  deploy:
    needs: [gate, image]
    runs-on: ubuntu-latest
    # Зависший apply держит блокировку состояния: лучше упасть раньше шести часов.
    timeout-minutes: 30
    # packages: read обязателен — образ тянет docker-провайдер тем же токеном.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.6

      # Хранилище состояния поднимает деплой бэкенда: он по требованию спеки
      # применяется раньше. Здесь нужны только ключ и туннель к хранилищу —
      # поэтому тридцать строк, а не копия чужого composite action целиком.
      - name: Подготовить подключение и туннель к хранилищу состояния
        env:
          CI_KEY: ${{ secrets.VPS_DMC268_KEY_T1 }}
          SSH_USER: ${{ secrets.VPS_DMC268_U }}
          HOST: ${{ vars.VPS_DMC268_IP_T1 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$CI_KEY" > ~/.ssh/ci_key
          chmod 600 ~/.ssh/ci_key
          # Ключ хоста закреплён в репозитории и сверен с сервером вне CI.
          # ssh-keyscan доверял бы любому, кто ответит по этому адресу.
          pinned="$GITHUB_WORKSPACE/.github/ssh/known_hosts"
          if ! ssh-keygen -F "$HOST" -f "$pinned" > /dev/null; then
            echo "::error::ключ хоста $HOST не закреплён в .github/ssh/known_hosts"
            exit 1
          fi
          cp "$pinned" ~/.ssh/known_hosts

          # Docker-провайдер вызывает ssh сам и флаг -i не передаёт: без записи
          # в конфиге он берёт личности по умолчанию, которых на раннере нет.
          cat > ~/.ssh/config <<CFG
          Host $HOST
            IdentityFile ~/.ssh/ci_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
          CFG
          chmod 600 ~/.ssh/config

          # ExitOnForwardFailure обязателен: без него ssh уходит в фон даже
          # когда проброс не удался, и всё падает позже с невнятной ошибкой.
          ssh -o ExitOnForwardFailure=yes -f -N \
            -L "${STATE_PORT}:127.0.0.1:${STATE_PORT}" "$SSH_USER@$HOST"

          for _ in $(seq 1 20); do
            if (exec 3<>"/dev/tcp/127.0.0.1/${STATE_PORT}") 2>/dev/null; then
              echo "туннель открыт, порт ${STATE_PORT} отвечает"
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::туннель поднялся, но порт ${STATE_PORT} не отвечает — применён ли стек бэкенда?"
          exit 1

      - name: Применить конфигурацию
        id: apply
        working-directory: infra
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_USER_DMC268_T1 }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_PASSWORD_DMC268_T1 }}
          AWS_DEFAULT_REGION: us-east-1
          SSH_USER: ${{ secrets.VPS_DMC268_U }}
          HOST: ${{ vars.VPS_DMC268_IP_T1 }}
          TF_VAR_ui_image: ${{ needs.image.outputs.image }}
          TF_VAR_registry_username: ${{ github.actor }}
          TF_VAR_registry_password: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # HTTPS с сертификатом Let's Encrypt на адрес стенда. Порт 80 нужен
          # и для проверки HTTP-01, и для перенаправления на HTTPS.
          export TF_VAR_docker_host="ssh://${SSH_USER}@${HOST}"
          export TF_VAR_service_host="$HOST"
          export TF_VAR_bind_ip="0.0.0.0"
          export TF_VAR_ui_port="80"
          export TF_VAR_public_tls="true"

          tofu init -input=false -no-color
          tofu apply -input=false -no-color -auto-approve
          echo "ui_url=$(tofu output -raw ui_url)" >> "$GITHUB_OUTPUT"

      - name: Проверить, что по адресу отдаётся именно интерфейс
        env:
          HOST: ${{ vars.VPS_DMC268_IP_T1 }}
        run: |
          set -uo pipefail
          # curl проверяет сертификат: так шаг заодно убеждается, что он
          # выпущен и действителен. При первом запуске на чистом томе nginx
          # получает его у Let's Encrypt — отсюда ожидание до двух минут.
          body=""
          for _ in $(seq 1 40); do
            body="$(curl -fsS --max-time 5 "https://${HOST}/" 2>/dev/null || true)"
            [ -n "$body" ] && break
            sleep 3
          done

          if [ -z "$body" ]; then
            echo "::error::по https://${HOST}/ ничего не отвечает или сертификат недействителен"
            curl -sSv --max-time 5 "https://${HOST}/" 2>&1 | tail -15 || true
            exit 1
          fi

          # Различаем «не отвечает» и «отвечает не тем»: на адресе мог бы
          # оказаться другой сервис или страница-заглушка nginx.
          case "$body" in
            *"DMC-268 UI"*) echo "интерфейс отдаётся по адресу" ;;
            *) echo "::error::адрес отвечает, но это не интерфейс"
               printf '%s\n' "$body" | head -5
               exit 1 ;;
          esac

          # HTTP не должен отдавать интерфейс открытым текстом — только
          # перенаправлять на HTTPS.
          location="$(curl -sS -o /dev/null -w '%{redirect_url}' --max-time 5 "http://${HOST}/" || true)"
          case "$location" in
            "https://${HOST}/") echo "HTTP перенаправляет на HTTPS" ;;
            *) echo "::error::HTTP не перенаправляет на HTTPS: '${location}'"; exit 1 ;;
          esac

      - name: Проверить, что API доступен через тот же адрес
        env:
          HOST: ${{ vars.VPS_DMC268_IP_T1 }}
        run: |
          set -uo pipefail
          # Требование спеки: браузеру не нужен второй адрес. Проксирование
          # делает nginx внутри контейнера интерфейса.
          # Без конвейера: с `set -o pipefail` короткий `grep -q` закрывает
          # канал, curl получает SIGPIPE, и проверка падает при работающем
          # сервисе.
          # /health наружу не публикуется — это проверка живости бэкенда, а
          # не часть API. Поэтому стучимся под /api/v1/ без -f: на путь без
          # ручки приложение отвечает JSON с полем "detail", а nginx (502)
          # и SPA-fallback (index.html) такого поля не дают.
          body="$(curl -sS --max-time 10 "https://${HOST}/api/v1/" || true)"
          case "$body" in
            *'"detail"'*) echo "API отвечает через адрес интерфейса: $body" ;;
            "") echo "::error::API через адрес интерфейса не ответил"; exit 1 ;;
            *) echo "::error::ответ пришёл, но не от API:"
               printf '%s\n' "$body" | head -5
               exit 1 ;;
          esac

      - name: Записать результат в summary
        if: always()
        run: |
          {
            echo "## Деплой интерфейса"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Образ | \`${{ needs.image.outputs.image }}\` |"
            echo "| Адрес | ${{ steps.apply.outputs.ui_url || 'не получен' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
