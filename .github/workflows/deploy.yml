# Деплой интерфейса на стенд. Катит только develop, как и бэкенд: сервер один.
#
# Стек бэкенда обязан быть применён раньше — интерфейс подключается к сети,
# которую создаёт он (требование спеки frontend-delivery). На чистом сервере
# этот деплой откажется выполняться, и это правильное поведение.
# См. openspec/changes/deploy-frontend-stack/.
name: Deploy

# Деплой ждёт CI: workflow_run срабатывает, когда CI завершился. Работает
# только из ветки по умолчанию — у нас это develop.
# zizmor считает workflow_run опасным триггером: риск принят — gate катит только
# прогон CI по push, и выкатывается проверенный head_sha, а не код из события.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # Какой коммит катить. Автоматический запуск — только после зелёного CI
  # по пушу в develop: прогон CI по пул-реквесту из ветки с именем develop
  # тоже попадает под фильтр branches, поэтому событие сверяется отдельно.
  # Ручной запуск — осознанное действие, CI он не ждёт, но только с develop:
  # с другой ветки не собирается и образ, а не только деплой. Второй замок —
  # environment `stand` у job'а deploy.
  gate:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - name: Выбрать коммит
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          # У workflow_run GITHUB_SHA — вершина ветки по умолчанию на момент
          # запуска, а не проверенный коммит; он лежит в head_sha.
          RUN_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          # Прогоны CI по develop не отменяют друг друга и могут закончиться
          # не по порядку: без этой сверки поздно завершившийся CI старого
          # коммита откатил бы стенд назад. Новый коммит катит свой прогон.
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            tip="$(gh api "repos/${GITHUB_REPOSITORY}/commits/develop" --jq .sha)"
            if [ "$tip" != "$RUN_SHA" ]; then
              echo "::notice::${RUN_SHA} уже не вершина develop (${tip}), деплой пропущен"
              exit 0
            fi
          fi
          echo "sha=${RUN_SHA}" >> "$GITHUB_OUTPUT"

  image:
    needs: gate
    if: needs.gate.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    # Наружу — одна ссылка `имя:тег@digest`. Тег показывает, что на стенде
    # (коммит и источник данных кабинета), а digest называет ровно собранный
    # здесь образ: пересборка того же коммита с другими build-args пушит образ
    # под тем же тегом, и по тегу tofu не увидел бы разницы. Проверка ui_image
    # в infra/variables.tf пропускает только ссылку с digest.
    outputs:
      image: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.gate.outputs.sha }}

      - name: Посчитать имя образа
        id: meta
        env:
          SHA: ${{ needs.gate.outputs.sha }}
          USE_MOCK_API: ${{ vars.VITE_USE_MOCK_API || 'true' }}
        run: |
          set -euo pipefail
          # Реестр принимает имя только в нижнем регистре, а в имени
          # репозитория бывают заглавные.
          if [ "$USE_MOCK_API" = false ]; then source=api; else source=mock; fi
          image="$(printf '%s' "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]'):${SHA}-${source}"
          echo "use_mock_api=$USE_MOCK_API" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "$image"

      # Без этого шага buildx работает на docker-драйвере, который не умеет
      # экспортировать кеш в gha.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          # Абсолютный адрес стенда попадает в canonical, Open Graph,
          # sitemap.xml и robots.txt лендинга при сборке. Источник данных
          # кабинета — переменная репозитория VITE_USE_MOCK_API, по умолчанию моки.
          # Адрес коллектора — переменная репозитория VITE_OTEL_EXPORTER_URL:
          # пока её нет, телеметрия кабинета выключена (прокси /otlp/ — api#108).
          # Окружение — production: стенд и есть прод, staging нет (api#97).
          build-args: |
            PUBLIC_ORIGIN=https://${{ vars.VPS_DMC268_IP_T1 }}
            VITE_USE_MOCK_API=${{ steps.meta.outputs.use_mock_api }}
            VITE_OTEL_EXPORTER_URL=${{ vars.VITE_OTEL_EXPORTER_URL }}
            VITE_OTEL_ENVIRONMENT=production
            VITE_APP_VERSION=${{ needs.gate.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Без provenance-аттестации: в ней данные прогона (id, время), и
          # повторная сборка того же коммита с теми же build-args давала бы
          # новый digest — tofu пересоздавал бы контейнер интерфейса без
          # изменений в образе. Аттестацию никто не читает.
          provenance: false

      - name: Убедиться, что образ забирается обратно
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # Пустой digest дал бы ссылку, которую отвергнет проверка ui_image,
          # но уже в job'е деплоя; ловим здесь.
          if [ -z "$DIGEST" ]; then
            echo "::error::build-push-action не вернул digest образа"
            exit 1
          fi
          docker manifest inspect "${IMAGE}@${DIGEST}" > /dev/null
          echo "образ доступен по digest: ${IMAGE}@${DIGEST}"

      # trivy в ci.yml смотрит образ, собранный в CI, а на стенд уезжает этот:
      # он собран заново, и пакеты базового nginx:1.30-alpine между сборками
      # могли смениться. Поэтому сканируется опубликованный digest — ровно то,
      # что запустит стенд, — с теми же порогами, что в CI. Образ в приватном
      # ghcr: trivy берёт креды из ~/.docker/config.json, который записал
      # docker/login-action выше. TRIVY_IMAGE_SRC=remote — сразу из реестра:
      # в локальном docker этого образа нет, buildx его не загружал.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: remote
        with:
          image-ref: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  deploy:
    needs: [gate, image]
    runs-on: ubuntu-latest
    # Зависший apply держит блокировку состояния: лучше упасть раньше шести часов.
    timeout-minutes: 30
    # Environment `stand` пускает только develop: ручной запуск с другой ветки
    # отклоняется до первого шага. Секреты при этом остаются в репозитории и
    # организации — job с environment видит их как и раньше.
    environment: stand
    # packages: read обязателен — образ тянет docker-провайдер тем же токеном.
    permissions:
      contents: read
      packages: read
    # Адрес стенда: имя для клиента, адрес проверок и summary. На сервер шаги
    # ходят через хост `stand` из ~/.ssh/config (stand-ssh).
    env:
      HOST: ${{ vars.VPS_DMC268_IP_T1 }}
    # Шаги с id — для summary: исход каждого берёт шаг summary, а каждый шаг с
    # `run` первой строкой ставит засечку (.github/scripts/deploy/mark.sh) —
    # по ним считается длительность. Так время шагов видно без `actions: read`
    # у токена. Раскладку сверяет .github/tests/deploy-report.test.mjs.
    steps:
      # Засечка до checkout — скрипта ещё нет, поэтому строкой здесь, в том же
      # формате, что у mark.sh. От неё считается подготовка и весь job.
      - name: Засечь начало деплоя
        id: start
        run: mkdir -p "$RUNNER_TEMP/deploy-report" && echo "start $(date +%s.%N)" >> "$RUNNER_TEMP/deploy-report/marks"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
          ref: ${{ needs.gate.outputs.sha }}

      # Ключ, known_hosts и хост `stand` в ~/.ssh/config для всех шагов ниже.
      - uses: ./.github/actions/stand-ssh
        id: ssh
        with:
          ssh_key: ${{ secrets.VPS_DMC268_KEY_T1 }}
          ssh_user: ${{ secrets.VPS_DMC268_U }}
          host: ${{ vars.VPS_DMC268_IP_T1 }}

      # Без обёртки: она копирует stdout каждого вызова tofu в выходы шага, а
      # это `show -json` плана с токеном реестра открытым текстом. Коды
      # возврата без неё те же.
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        id: tofu
        with:
          tofu_version: 1.13.2
          tofu_wrapper: false

      # Хранилище состояния поднимает деплой бэкенда: по спеке он применяется
      # раньше. Здесь — только туннель к нему. Порт — тот же, что в endpoints
      # infra/backend.tf.
      - uses: ./.github/actions/state-tunnel
        id: state
        with:
          port: '9000'

      # План — в файл, сторож тома ACME — до apply (plan.sh). HTTPS с
      # сертификатом Let's Encrypt на адрес стенда; порт 80 нужен и для
      # проверки HTTP-01, и для перенаправления на HTTPS.
      - name: Спланировать и проверить план
        id: plan
        env: &tofu-env
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_USER_DMC268_T1 }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_PASSWORD_DMC268_T1 }}
          AWS_DEFAULT_REGION: us-east-1
          # Docker-провайдер зовёт системный ssh, и тот берёт пользователя,
          # адрес и ключ из ~/.ssh/config.
          TF_VAR_docker_host: ssh://stand
          TF_VAR_service_host: ${{ vars.VPS_DMC268_IP_T1 }}
          TF_VAR_bind_ip: 0.0.0.0
          TF_VAR_ui_port: '80'
          TF_VAR_public_tls: 'true'
          TF_VAR_ui_image: ${{ needs.image.outputs.image }}
          TF_VAR_registry_username: ${{ github.actor }}
          TF_VAR_registry_password: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .github/scripts/deploy/mark.sh
          .github/scripts/deploy/plan.sh

      # Применяется ровно проверенный план. Заодно apply.sh собирает события
      # контейнера интерфейса для разбивки простоя в summary и удаляет файл
      # плана. Переменные — те же (якорь).
      - name: Применить конфигурацию
        id: apply
        env: *tofu-env
        run: |
          .github/scripts/deploy/mark.sh
          .github/scripts/deploy/apply.sh

      # Проверки стенда — .github/scripts/deploy/ (shellcheck в CI) и
      # scripts/check-routes.sh, общий с CI. Первый ответ HTTPS и /api/v1/
      # check-site.sh и check-api-proxy.sh записывают для summary.
      - name: Проверить, что по адресу отдаётся именно наш сайт
        id: check_site
        run: |
          .github/scripts/deploy/mark.sh
          .github/scripts/deploy/check-site.sh

      - name: Проверить маршруты
        id: check_routes
        run: |
          .github/scripts/deploy/mark.sh
          scripts/check-routes.sh "https://${HOST}"

      - name: Проверить сжатие статики
        id: check_compression
        run: |
          .github/scripts/deploy/mark.sh
          .github/scripts/deploy/check-compression.sh "https://${HOST}"

      - name: Проверить HTTP/2 и HTTP/3
        id: check_protocols
        run: |
          .github/scripts/deploy/mark.sh
          .github/scripts/deploy/check-protocols.sh

      - name: Проверить, что API доступен через тот же адрес
        id: check_api_proxy
        run: |
          .github/scripts/deploy/mark.sh
          .github/scripts/deploy/check-api-proxy.sh "https://${HOST}"

      # Исход, шаг падения, простой публичного входа, план, диск и длительность
      # шагов (summary.sh). Исходы шагов — списком, а не toJSON(steps): тот
      # несёт и выходы шагов, а env шага печатается в лог. Строка на каждый
      # шаг с id (сверяет .github/tests/deploy-report.test.mjs).
      - name: Записать результат в summary
        id: summary
        if: always()
        # ssh внутри — под `timeout 30` (summary.sh); это — потолок шага на
        # случай, если повиснет что-то ещё: job ждал бы до своих 30 минут.
        timeout-minutes: 3
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          SHA: ${{ needs.gate.outputs.sha }}
          JOB_STATUS: ${{ job.status }}
          STEP_RESULTS: |
            start ${{ steps.start.outcome }} ${{ steps.start.conclusion }}
            checkout ${{ steps.checkout.outcome }} ${{ steps.checkout.conclusion }}
            ssh ${{ steps.ssh.outcome }} ${{ steps.ssh.conclusion }}
            tofu ${{ steps.tofu.outcome }} ${{ steps.tofu.conclusion }}
            state ${{ steps.state.outcome }} ${{ steps.state.conclusion }}
            plan ${{ steps.plan.outcome }} ${{ steps.plan.conclusion }}
            apply ${{ steps.apply.outcome }} ${{ steps.apply.conclusion }}
            check_site ${{ steps.check_site.outcome }} ${{ steps.check_site.conclusion }}
            check_routes ${{ steps.check_routes.outcome }} ${{ steps.check_routes.conclusion }}
            check_compression ${{ steps.check_compression.outcome }} ${{ steps.check_compression.conclusion }}
            check_protocols ${{ steps.check_protocols.outcome }} ${{ steps.check_protocols.conclusion }}
            check_api_proxy ${{ steps.check_api_proxy.outcome }} ${{ steps.check_api_proxy.conclusion }}
        run: |
          .github/scripts/deploy/mark.sh
          .github/scripts/deploy/summary.sh
