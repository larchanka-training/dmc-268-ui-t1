name: Node и зависимости
description: >-
  Node из .nvmrc, pnpm через corepack и pnpm install по lock-файлу — общий
  setup всех job'ов CI, чтобы он менялся в одном месте.

runs:
  using: composite
  steps:
    # pnpm берётся из Node через corepack, версия — из packageManager в
    # package.json. Шаг идёт до setup-node: кешу pnpm нужен сам pnpm.
    - run: corepack enable
      shell: bash
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
