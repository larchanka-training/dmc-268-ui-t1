workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - syntax
  - lint
  - test

syntax:
  stage: syntax
  image: node:22
  script:
    - corepack enable
    - pnpm install --frozen-lockfile
    - pnpm run typecheck

lint:
  stage: lint
  image: node:22
  script:
    - corepack enable
    - pnpm install --frozen-lockfile
    - pnpm run lint

test:
  stage: test
  image: node:22
  script:
    - corepack enable
    - pnpm install --frozen-lockfile
    - pnpm run test
