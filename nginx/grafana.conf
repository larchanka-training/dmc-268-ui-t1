# Сервер Grafana стенда на своём порту (8443): дашборды наблюдаемости бэкенда
# в сети dmc268-grafana-proxy (её создаёт стек бэкенда). Подключается в оба
# режима — nginx/http.conf и nginx/https.conf.template, — как site.conf.
#
# Свой порт — свой origin. На общем с кабинетом origin XSS в Grafana
# (CVE-2025-4123, JS плагинов панелей) делал бы fetch('/api/v1/...') с cookie
# пользователя, читал ответ и проходил проверку Origin как same-origin. С
# другого порта такой ответ закрыт CORS, а проверка Origin бэкенда не пройдёт.
#
# Вход в Grafana — по личной учётной записи: cookie сессии кабинета nginx не
# проверяет, доступ решает сама Grafana.
#
# Заголовки — на уровне server, и location ниже своих add_header не задают:
# тогда ответы всех location, и 502 тоже, получают этот набор целиком. CSP
# кабинета (script-src 'self') сюда не попадает: Grafana без inline-скриптов
# и стилей не работает. CSP — только то, что Grafana не ломает: запрет фрейма,
# плагинов и смены базового адреса. Свой nosniff Grafana прячем, чтобы
# заголовок не пришёл дважды.
proxy_hide_header X-Content-Type-Options;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

# Grafana отдаёт себя из подпути /grafana/ (GF_SERVER_SERVE_FROM_SUB_PATH в
# бэкенде), поэтому путь уходит как пришёл: URI в proxy_pass нет. Переменная —
# как у /api/: nginx стартует, когда dmc268-grafana не резолвится, и Grafana
# тогда отвечает 502. set на уровне server выполняется до выбора location, и
# переменная есть в каждой из них.
set $grafana_upstream http://dmc268-grafana:3000;

# Host — чтобы проверка Origin в Grafana сошлась с адресом стенда; с портом,
# потому что GF_SERVER_ROOT_URL — с :8443. Адрес клиента — $remote_addr, а не
# цепочка из запроса: nginx — первый узел, и X-Forwarded-For от клиента
# подделал бы адрес в логах Grafana.
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

# Cookie сессии кабинета (session, Path=/) браузер прикладывает и сюда: cookie
# портом не разделяются. Grafana она не нужна, а выполнение кода в процессе
# Grafana собрало бы рабочие сессии кабинета у всех, кто её открывает.
# Срезаем только session: map $cookie_without_session — на уровне http.
proxy_set_header Cookie $cookie_without_session;

# WebSocket Grafana Live (/grafana/api/live/): без Upgrade и Connection nginx
# не передаёт переход на WebSocket. Map $connection_upgrade — на уровне http.
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Корень Grafana с подпутём уводит на /grafana/ сама.
location / {
    proxy_pass $grafana_upstream;
}

# Location — относительный: иначе nginx подставил бы порт, который слушает сам,
# а снаружи порт может быть другим (локально, при пробросе портов docker).
location = /grafana {
    absolute_redirect off;
    return 301 /grafana/$is_args$args;
}

# Вход — POST на /grafana/login: частоту попыток с адреса режет зона
# grafana_login (http.conf, https.conf.template), GET страницы входа не
# считается. Перебор по учётной записи ловит ещё и сама Grafana. Regex, а не
# точное совпадение: Grafana принимает вход и на /grafana/login/, а regex
# сверяется с нормализованным $uri — %2F и /. в пути его не обходят.
location ~ ^/grafana/login/?$ {
    limit_req zone=grafana_login burst=10 nodelay;
    limit_req_status 429;
    proxy_pass $grafana_upstream;
}
