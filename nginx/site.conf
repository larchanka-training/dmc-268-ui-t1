# Общая часть сервера интерфейса: лендинг и статика, приложение под /app/,
# прокси на API.
# Подключается в оба режима — nginx/http.conf и nginx/https.conf.template, —
# чтобы локальный и стендовый режимы не разошлись.

root /usr/share/nginx/html;
index index.html;

# Заголовки безопасности — на уровне server, поэтому одинаковы в обоих
# режимах и доходят до каждого ответа: страниц, статики, редиректов (return),
# 404 и проксируемого /api/. always — иначе nginx не добавит их к 4xx и 5xx.
#
# add_header из server не наследуется в location со своим add_header
# (Cache-Control ниже), если не включён merge (nginx 1.29.3+). merge задан
# здесь, а не в https.conf.template: файл общий, и без merge в режиме HTTP
# заголовки потерялись бы как раз у HTML-страниц. Директива наследуется во
# все location и во вложенные if.
add_header_inherit merge;

# nosniff: браузер не угадывает тип по содержимому, и загруженное не как
# скрипт не исполнится как скрипт.
add_header X-Content-Type-Options "nosniff" always;

# Чужим сайтам — только origin, без пути: в пути /app/... идентификаторы
# прогонов, в /login — адрес возврата. same-origin строже, но скрыл бы лишь
# сам адрес стенда, который и так публичен.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Скрипты — только модули из /assets/: inline-скриптов нет ни на одной
# странице. 'unsafe-inline' в style-src нужен antd: CSS-in-JS вставляет
# <style> в рантайме. Аватары пользователей — с avatars.githubusercontent.com,
# SSE (EventSource) и запросы к API — на тот же адрес. frame-ancestors 'none'
# запрещает встраивать страницы во фрейм; X-Frame-Options не нужен — его
# понимают только браузеры без CSP 2, а таких среди поддерживаемых нет.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://avatars.githubusercontent.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# Адрес возврата после входа для гостя, которого /app/ уводит на /login.
# Вычисляется здесь, на уровне server, а не в location /app/: set внутри if в
# location переключает запрос на вложенную конфигурацию if, где нет
# try_files, и глубокие ссылки получают 404.
#
# Путь берём из $request_uri, а не из $uri: $uri раскодирован, и %0D%0A в
# адресе превратился бы в перевод строки внутри Location — чужой заголовок в
# нашем ответе. Путь с символами вне списка заменяется на /app/: & или ?
# внутри значения порвали бы параметр redirect. Сам redirect проверяет бэкенд
# (change auth-session).
set $login_redirect /app/;
if ($request_uri ~ "^(/app/[-A-Za-z0-9/_.~%]*)(\?|$)") {
    set $login_redirect $1;
}

# Статика сжимается при сборке (gzip -9 в Dockerfile): nginx отдаёт готовый
# .gz и не тратит CPU на каждый запрос. Ответы API сжимаются на лету.
# text/event-stream в gzip_types нет намеренно: сжатие буферизует ответ, и
# события SSE приходили бы пачками.
gzip_static on;
gzip on;
gzip_types application/json application/javascript text/css image/svg+xml;
gzip_min_length 1024;
gzip_vary on;

# Редиректы с относительным Location: иначе nginx подставит свой порт 80, и
# за проброшенным портом (docker run -p 8080:80) редирект уходит мимо.
absolute_redirect off;

# Документы, с которых начинается загрузка: лендинг, HTML приложения (в
# location /app/) и страница 404. Без no-cache браузер держал бы старую версию
# после деплоя. index для / отдаёт тот же index.html внутренним переходом,
# поэтому заголовок срабатывает и на нём.
location = /index.html {
    add_header Cache-Control "no-cache";
}

# always: на ответ 404 add_header без него не добавляется.
location = /404.html {
    add_header Cache-Control "no-cache" always;
}

location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

location /api/ {
    # Вебхуки хостинга идут сюда же, а GitHub шлёт их до 25 МБ. По
    # умолчанию nginx режет тело на 1 МБ и отвечает 413.
    client_max_body_size 25m;

    # Переменная в proxy_pass нужна, чтобы nginx стартовал, когда
    # dmc268-api ещё не резолвится. URI в proxy_pass нет, поэтому nginx
    # передаёт исходный путь как есть: префикс /api/v1 ставит само
    # приложение (контракт API), и срезать его здесь нельзя — иначе
    # каждая ручка отдаст 404.
    set $api_upstream http://dmc268-api:8000;
    proxy_pass $api_upstream;
}

# Трейсы браузера (OTLP/HTTP) — на коллектор стека наблюдаемости бэкенда, в
# сети dmc268-otlp. Кабинет шлёт их на свой же origin, поэтому CORS не нужен
# и CSP (connect-src 'self') не меняется. Только этот путь и только POST:
# метрики и логи коллектора браузеру не открываем.
#
# Cookie срезаем: экспортёр шлёт запрос same-origin, браузер прикладывает
# cookie сессии, а настройки credentials у OTel-экспортёра нет. Лимит тела —
# с запасом на 100 ошибок со стеком; частота — зона otlp (http.conf,
# https.conf.template). Переменная в proxy_pass — как у /api/: nginx стартует,
# когда коллектора нет, и /otlp/v1/traces тогда отвечает 502.
location = /otlp/v1/traces {
    limit_except POST {
        deny all;
    }
    limit_req zone=otlp burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 512k;
    proxy_set_header Cookie "";
    set $otlp_upstream http://dmc268-otelcol:4319/v1/traces;
    proxy_pass $otlp_upstream;
}

# Grafana стенда — дашборды наблюдаемости бэкенда, в сети dmc268-grafana-proxy
# (её создаёт стек бэкенда). Вход в Grafana — по личной учётной записи: nginx
# не проверяет cookie сессии кабинета, доступ решает сама Grafana.
#
# Grafana отдаёт себя из подпути (GF_SERVER_SERVE_FROM_SUB_PATH в бэкенде),
# поэтому путь уходит как пришёл, с префиксом /grafana/: URI в proxy_pass
# нет. Переменная — как у /api/: nginx стартует, когда dmc268-grafana не
# резолвится, и /grafana/ тогда отвечает 502.
location = /grafana {
    return 301 /grafana/;
}

location /grafana/ {
    set $grafana_upstream http://dmc268-grafana:3000;
    proxy_pass $grafana_upstream;

    # Host — чтобы проверка Origin в Grafana сошлась с адресом стенда.
    # Адрес клиента — $remote_addr, а не цепочка из запроса: nginx — первый
    # узел, и X-Forwarded-For от клиента подделал бы адрес в логах Grafana.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket Grafana Live (/grafana/api/live/): без Upgrade и Connection
    # nginx не передаёт переход на WebSocket. Map $connection_upgrade — на
    # уровне http, в http.conf и https.conf.template.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Свой набор заголовков безопасности вместо общего: CSP кабинета
    # (script-src 'self') запрещает inline-скрипты и стили, без которых
    # Grafana не работает. off отменяет и merge с уровня server, поэтому
    # нужное повторено здесь. CSP — только то, что Grafana не ломает: запрет
    # фрейма, плагинов и смены базового адреса. HSTS и Alt-Svc — переменные
    # с уровня http: в режиме HTTP они пустые, и nginx заголовок не ставит.
    # Свой nosniff Grafana прячем, чтобы заголовок не пришёл дважды.
    add_header_inherit off;
    proxy_hide_header X-Content-Type-Options;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    add_header Strict-Transport-Security $strict_transport_security always;
    add_header Alt-Svc $alt_svc always;

    # Вход — POST на /grafana/login: частоту попыток с адреса режет зона
    # grafana_login (http.conf, https.conf.template), GET страницы входа не
    # считается. Перебор по учётной записи ловит ещё и сама Grafana.
    # proxy_pass и set не наследуются во вложенную location — повторены.
    # add_header_inherit on: off родителя наследуется и сюда, и без своих
    # add_header вложенная location осталась бы вовсе без заголовков
    # безопасности; on берёт их у /grafana/ по обычным правилам.
    location = /grafana/login {
        add_header_inherit on;
        limit_req zone=grafana_login burst=10 nodelay;
        limit_req_status 429;
        set $grafana_upstream http://dmc268-grafana:3000;
        proxy_pass $grafana_upstream;
    }
}

# Приложение живёт под /app/: любой путь под префиксом отдаёт его HTML, чтобы
# глубокая ссылка открывалась после перезагрузки. То же правило — в
# src/build/appRoutes.ts для dev-сервера Vite; на dev-сервере гостя не
# уводят на вход: это делает приложение по ответу /api/v1/auth/me бэкенда.
#
# Гостя уводим на вход, не отдавая ему HTML и бандл приложения. Как и на
# /login, судим по наличию cookie сессии: недействительную удаляет бэкенд
# ответом 401, и приложение уводит на /login само.
#
# Адрес возврата ($login_redirect) вычисляется в начале файла, на уровне
# server. В location внутри if — только return.
location = /app {
    if ($cookie_session = "") {
        return 302 /login?redirect=/app/;
    }
    return 301 /app/;
}

# Помощь и статус сервиса — публичные страницы приложения: гостю их HTML
# отдаём, как /login отдаёт свой. Помощи данные с сервера не нужны, статус
# берёт их из открытой без сессии ручки /api/v1/status (location /api/ cookie
# не проверяет). Регулярка пускает /app/help, /app/status и они же со слешем
# и ничего глубже: /app/help/x, /app/status/x и остальные пути под /app/
# по-прежнему закрыты для гостя. Регулярная location проверяется раньше
# префиксной /app/.
location ~ ^/app/(help|status)/?$ {
    add_header Cache-Control "no-cache";
    try_files /app/index.html =404;
}

location /app/ {
    if ($cookie_session = "") {
        return 302 /login?redirect=$login_redirect;
    }
    add_header Cache-Control "no-cache";
    try_files $uri /app/index.html;
}

# Вход — статичная страница: OAuth целиком на бэкенде под /api/. Вошедшему
# она не нужна, его сразу уводим в приложение. Вошёл ли пользователь, nginx
# судит по наличию cookie сессии, а не по её действительности: протухшую
# cookie бэкенд удаляет в ответе 401, и следующий заход на /login уже без
# неё. Имя cookie — контракт с бэкендом. Адрес без .html — тот же список,
# что STATIC_PAGES в src/build/appRoutes.ts для dev-сервера.
location = /login {
    if ($cookie_session) {
        return 302 /app/;
    }
    add_header Cache-Control "no-cache";
    try_files /login.html =404;
}

# Файл страницы входа открывается только как /login: иначе /login.html ушёл
# бы в location / — без no-cache и без редиректа вошедшего. Внутренний
# try_files в location = /login отдаёт файл сам, сюда не попадает.
location = /login.html {
    return 301 /login$is_args$args;
}

# Вне /app/ — только статика (лендинг, robots.txt, sitemap.xml, картинки).
# Несуществующий путь получает 404 со статичной страницей, а не приложение.
error_page 404 /404.html;

# Сутки кеша для статики без хеша в имени (favicon.svg, og.png, robots.txt,
# sitemap.xml): имя не меняется при деплое, поэтому не immutable. / и 404
# сюда не доходят — их отдают location = /index.html и = /404.html со своим
# no-cache. Заголовки безопасности, а в HTTPS-режиме и HSTS с Alt-Svc,
# сохраняет add_header_inherit merge.
location / {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri $uri/ =404;
}
