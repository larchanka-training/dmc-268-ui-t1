# Счётчики nginx для коллектора метрик стека наблюдаемости бэкенда (ui#101): receiver
# `nginx` в dmc-268-api-t1 снимает /stub_status по сети dmc268-otlp. Порт 8081 на хост не
# публикуется (infra/ui.tf публикует только 80 и 443), поэтому снаружи до него не дотянуться;
# видят его контейнеры сетей dmc268 и dmc268-otlp, а в нём только счётчики.
# Его же опрашивает healthcheck контейнера (infra/ui.tf).
# Отдельный server, а не location в site.conf: так он один и в режиме HTTP, и в HTTPS
# (select-site.sh пишет только conf.d/default.conf).
server {
    listen 8081;
    access_log off;

    location = /stub_status {
        stub_status;
    }

    location / {
        return 404;
    }
}
